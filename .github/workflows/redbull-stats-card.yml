name: Generate Red Bull All-Repo Stats Card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - ".github/workflows/redbull-stats-card.yml"
      - ".github/scripts/generate_redbull_stats.py"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Red Bull all-repo stats SVG
        env:
          GH_TOKEN: ${{ secrets.stats }}
          USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/generate_redbull_stats.py

      - name: Commit generated SVG
        run: |
          if [ -z "$(git status --porcelain -- assets/redbull-all-repo-stats.svg)" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/redbull-all-repo-stats.svg
          git commit -m "Update Red Bull all-repo stats card"
          git push
